<footer class="site-footer">
    <div class="container footer-grid">
        <div class="footer-col">
            <p class="kicker footer-kicker">{{ site.title | default: "Lahiru Pathirage" }}</p>
            <p class="footer-tagline">Building software since 2016.</p>
            <p class="footer-studio">Also at <a href="https://softiva.app/" target="_blank" rel="noopener" class="footer-link">softiva.app</a> &nearr;</p>
        </div>
        <div class="footer-col">
            <p><a href="https://github.com/{{ site.social.github }}" target="_blank" rel="noopener" class="footer-link">GitHub</a></p>
            <p><a href="https://linkedin.com/in/{{ site.social.linkedin }}" target="_blank" rel="noopener" class="footer-link">LinkedIn</a></p>
            <p><a href="{{ '/feed.xml' | relative_url }}" class="footer-link">RSS</a></p>
        </div>
        <div class="footer-col footer-col-end">
            <p class="footer-attribution">Set in Fraunces &amp; Inter. Built in a terminal.</p>
            <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.author.name | default: site.title }}</p>
        </div>
    </div>
</footer>
