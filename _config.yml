title: "Lahiru Pathirage"
description: "Software engineer based in Sri Lanka. Building AI agents and serverless backends since 2016."
baseurl: ""
url: "https://lpsandaruwan.github.io"

# Author information
author:
  name: "Lahiru Sandaruwan Pathirage"
  email: "lpsandaruwan@gmail.com"
  bio: "Software engineer focused on AI agents and serverless backends. Building since 2016."

# Social links
social:
  github: "lpsandaruwan"
  linkedin: "lpsandaruwan"
  facebook: "lpsandaruwan1"
  twitter: "lpsandaruwan"
  youtube: "lpsandaruwan"

# Comments
comments:
  active: disqus
  disqus:
    shortname: lpsandaruwan

markdown: kramdown
highlighter: rouge
theme: minima

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  posts:
    output: true
    permalink: /writing/:title/

# Permalink structure for clean URLs
permalink: /writing/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"
      author: "Lahiru Sandaruwan Pathirage"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - docs/
